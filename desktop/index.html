<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy for the renderer. `connect-src` allows the Convex
      deployment over https + wss plus `pidom-doc:`, the scheme main serves a
      verified local PDF back over; the loopback OAuth never touches the
      renderer, and R2 is absent because main fetches the signed URL, not us.
      `worker-src` covers the bundled PDF.js worker.

      This tag only applies in development, where `script-src` keeps
      `'unsafe-inline'` for Vite's HMR / React-refresh preamble. The packaged app
      serves a stricter policy as an HTTP header from src/main/index.ts
      (`script-src 'self'`, no `'unsafe-inline'`), which Electron treats as
      authoritative. The pre-paint theme setter is loaded from `/theme-init.js`
      (a same-origin external file, see public/theme-init.js) precisely so the
      packaged `'self'`-only script policy accepts it — an inline script would be
      blocked there. Keep the two policies in sync otherwise.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' pidom-doc: https://*.convex.cloud wss://*.convex.cloud https://*.convex.site; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon: the Pidom mark (../assets/pidom-mark.svg) in white on the brand
      primary (#6A59E8, the --primary token), inlined as a data URI so the dev
      tab / window carries the logo with no extra asset plumbing and it works
      identically packaged. `img-src ... data:` in the CSP above allows it.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236A59E8'/%3E%3Cpath transform='translate(32 32) scale(0.72) translate(-32 -32)' fill='%23ffffff' d='M 30 4 C 14.561 4 2 16.561 2 32 C 2 47.439 14.561 60 30 60 L 33 60 C 48.439 60 61 47.439 61 32 C 61 26.600951 59.460842 21.556431 56.802734 17.275391 L 62.039062 12.039062 L 59.210938 9.2109375 L 54.423828 13.998047 C 49.283425 7.890176 41.589024 4 33 4 L 30 4 z M 33 8 C 40.486401 8 47.18112 11.446946 51.585938 16.835938 L 33.375 35.046875 L 21.664062 23.335938 L 18.835938 26.164062 L 33.375 40.703125 L 53.882812 20.195312 C 55.862819 23.683904 57 27.710097 57 32 C 57 45.234 46.233 56 33 56 C 19.767 56 9 45.234 9 32 C 9 18.766 19.767 8 33 8 z'/%3E%3C/svg%3E"
    />
    <title>Pidom</title>
    <!--
      Pre-paint theme setter, loaded synchronously before the app bundle so it
      runs before first paint (no theme flash). A same-origin external file
      rather than an inline block so the packaged `script-src 'self'` CSP accepts
      it with no `'unsafe-inline'`. See public/theme-init.js.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-background text-foreground font-sans">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
