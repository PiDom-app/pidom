name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # These need no deployment, and they catch the class of bug that has
      # actually shipped here: a colour utility naming a token that does not
      # exist renders nothing, silently.
      - name: Every colour resolves to a token
        run: node scripts/check-tokens.mjs

      - name: Expo Doctor
        run: npm run doctor

      - name: Expo Android configuration
        run: npm run config:check

  release:
    name: Production release
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Validate release credentials
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$CONVEX_DEPLOY_KEY"

      - name: Deploy Convex production
        run: npx convex deploy --typecheck enable --codegen enable --message "GitHub $GITHUB_SHA"

      - name: Build signed Android APK
        run: eas build --platform android --profile production --non-interactive --wait --freeze-credentials --json > "$RUNNER_TEMP/eas-build.json"

      - name: Download and checksum APK
        id: apk
        run: |
          # Reads the build id, version code and APK URL out of the EAS result,
          # and — unlike the `require()` one-liners this replaced — says exactly
          # what is wrong with the file when it cannot, instead of a bare stack
          # trace that scrolls off the top of the log above `exit code 1`.
          # It writes `build_id`/`version_code`/`apk_url` to $GITHUB_OUTPUT for
          # the release step, and prints the same lines here so this step can
          # use two of them without re-reading a file GitHub owns.
          node scripts/eas-artifact.mjs "$RUNNER_TEMP/eas-build.json" > "$RUNNER_TEMP/eas-outputs.txt"
          VERSION_CODE="$(sed -n 's/^version_code=//p' "$RUNNER_TEMP/eas-outputs.txt")"
          APK_URL="$(sed -n 's/^apk_url=//p' "$RUNNER_TEMP/eas-outputs.txt")"
          mkdir -p release
          RELEASE_APK="release/Pidom-${VERSION_CODE}.apk"
          curl --fail --location --retry 3 --retry-all-errors --output "$RELEASE_APK" "$APK_URL"
          test -s "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Create public GitHub Release
        env:
          BUILD_ID: ${{ steps.apk.outputs.build_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          APK: ${{ steps.apk.outputs.apk }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(npx expo config --json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version))')"
          TAG="v${APP_VERSION}-android.${VERSION_CODE}"
          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          GENERATED_NOTES="$RUNNER_TEMP/generated-release-notes.json"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" > "$GENERATED_NOTES"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" > "$GENERATED_NOTES"
          fi

          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          APP_VERSION="$APP_VERSION" \
            VERSION_CODE="$VERSION_CODE" \
            BUILD_ID="$BUILD_ID" \
            TAG="$TAG" \
            APK="$APK" \
            GENERATED_NOTES="$GENERATED_NOTES" \
            RELEASE_NOTES="$RELEASE_NOTES" \
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const generated = JSON.parse(fs.readFileSync(process.env.GENERATED_NOTES, 'utf8'));
          const generatedBody = String(generated.body || '').trim();
          const apkName = path.basename(process.env.APK);
          const checksumName = `${apkName}.sha256`;

          const notes = `## Release

          Pidom ${process.env.APP_VERSION} for Android, build ${process.env.VERSION_CODE}.

          - APK: \`${apkName}\`
          - SHA-256 checksum: \`${checksumName}\`
          - EAS build ID: \`${process.env.BUILD_ID}\`
          - Commit: \`${process.env.GITHUB_SHA}\`

          ## Install and Verify

          Download \`${apkName}\` and \`${checksumName}\` from this release, then verify the APK before installing:

          \`\`\`sh
          sha256sum -c ${checksumName}
          \`\`\`

          A matching checksum means the APK is byte-for-byte the file produced and attached by this release workflow.

          ## What's Changed

          ${generatedBody || 'No GitHub changelog entries were generated for this release.'}

          ## Security and Integrity

          - The APK is signed by the EAS-managed Android keystore for \`com.pidom.app\`.
          - No local Firebase files, EAS tokens, Convex deploy keys, R2 credentials, keystores, or private keys are committed to this repository.
          - Release assets include a SHA-256 checksum for independent download verification.
          - Production builds upload JavaScript source maps for EAS Observe symbolication; Expo removes embedded source content before storing them.
          - PDF rendering keeps certificate validation enabled by explicitly setting \`trustAllCerts={false}\` on every \`react-native-pdf\` mount.

          ## Observability

          - EAS Observe is enabled for production startup metrics.
          - Expo Router navigation metrics are enabled with sensitive route/query parameters filtered from exported events.
          - SDK 57 JavaScript error reporting is enabled for unhandled and render errors; handled-error reporting is intentionally left out until each recovered error path has a dedicated redaction review.

          ## Updates and Runtime

          This release adds the native \`expo-observe\` dependency, so it ships as a new APK on app version runtime \`${process.env.APP_VERSION}\`. Future JavaScript-only fixes can be published with EAS Update to the matching production runtime.

          Release tag: https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.TAG}
          `;

          fs.writeFileSync(
            process.env.RELEASE_NOTES,
            notes
              .split('\n')
              .map((line) => line.replace(/^ {10}/, ''))
              .join('\n')
              .trimStart(),
          );
          NODE

          gh release create "$TAG" "$APK" "${APK}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Pidom ${APP_VERSION}" \
            --notes-file "$RELEASE_NOTES"

      - name: Publish EAS Update
        run: |
          # The APK and checksum have already been attached to the GitHub
          # Release. Remove those generated files before EAS enforces its
          # clean-working-tree release guard.
          rm -rf release
          test -z "$(git status --porcelain)"
          eas update --channel production --environment production --non-interactive \
            --message "GitHub ${GITHUB_SHA}"

  # ---------------------------------------------------------------------------
  # Desktop companion (desktop/). Its own npm project (not a workspace), its own
  # lockfile, and no eslint/prettier/tests — the quality gate is the token guard
  # plus typecheck. `desktop/src/renderer/routeTree.gen.ts` is gitignored
  # (regenerated on start), so `npm run routes` must run before typecheck/build
  # or both fail on the missing route tree. `--legacy-peer-deps` matches how the
  # lockfile was resolved (@electron/fuses 2.x vs the forge fuses plugin's ^1.0.0
  # peer range).
  # ---------------------------------------------------------------------------
  desktop-quality:
    name: desktop quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      # The desktop typecheck resolves the shared Convex API: `@convex/api` →
      # ../convex/_generated, whose generated `api.d.ts` imports every backend
      # module, which in turn import the backend's own dependencies
      # (@convex-dev/*, unpdf, …). Those are declared in the ROOT project, not in
      # desktop/, so without them `tsc` would see `api` as `any` and every
      # renderer callback would fail noImplicitAny. Install the root deps too —
      # desktop's tsconfig pins `types: ["node","vite/client"]`, so no React
      # Native / Expo ambient types leak into the desktop compile.
      - name: Install shared backend type dependencies (root)
        run: npm ci

      - name: Generate route tree
        working-directory: desktop
        run: npm run routes

      - name: Every colour resolves to a token
        working-directory: desktop
        run: npm run tokens

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

  desktop-release:
    name: Desktop release (Windows)
    needs: desktop-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    # Distinct from the mobile `production-release` group so the two release jobs
    # run in parallel on the same push and never cancel one another.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      # Baked into the build. All four are non-confidential public identifiers
      # (see desktop/.env.example) — VITE_* into the renderer, GOOGLE_* into the
      # main bundle only. PKCE secures the OAuth exchange; no secret ships.
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate build configuration
        run: |
          # Fail fast (like the mobile job's credential check) if the shared
          # Convex deployment URL is missing — a build without it would ship a
          # binary that cannot reach the backend.
          test -n "$VITE_CONVEX_URL"

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generate route tree
        run: npm run routes

      - name: Build Windows installer
        run: npm run make

      - name: Sign installer (SignPath)
        # Disabled until the SignPath Foundation setup in desktop/SIGNING.md is
        # complete: make the repo public, get Foundation approval, install the
        # SignPath GitHub App, then set the repo variable SIGNPATH_ENABLED=true
        # and the SIGNPATH_* secrets/vars. Before enabling, pin the action below
        # to a full commit SHA (see SIGNING.md) — until then this step is skipped
        # and releases ship unsigned.
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ github.run_id }}
          wait-for-completion: true

      - name: Stage and checksum installer
        id: installer
        run: |
          # Resolve the Setup.exe by glob rather than hardcoding the winstaller
          # filename, copy it to a stable release name, and checksum it. Git Bash
          # on windows-latest ships sha256sum.
          DESKTOP_VERSION="$(node -p "require('./package.json').version")"
          SETUP_EXE="$(find out/make/squirrel.windows -name '*.exe' | head -n 1)"
          test -n "$SETUP_EXE"
          mkdir -p release
          RELEASE_EXE="release/Pidom-Setup-${DESKTOP_VERSION}.exe"
          cp "$SETUP_EXE" "$RELEASE_EXE"
          test -s "$RELEASE_EXE"
          sha256sum "$RELEASE_EXE" > "${RELEASE_EXE}.sha256"
          echo "version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "exe=$RELEASE_EXE" >> "$GITHUB_OUTPUT"

      - name: Create public GitHub Release
        env:
          DESKTOP_VERSION: ${{ steps.installer.outputs.version }}
          EXE: ${{ steps.installer.outputs.exe }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer version is static until package.json is bumped, so the
          # tag is namespaced and made unique per run with the run number —
          # mirroring the mobile `-android.<code>` shape while staying
          # collision-free across every-merge builds.
          TAG="v${DESKTOP_VERSION}-desktop.${GITHUB_RUN_NUMBER}"
          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          GENERATED_NOTES="$RUNNER_TEMP/desktop-generated-notes.json"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" > "$GENERATED_NOTES"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" > "$GENERATED_NOTES"
          fi

          RELEASE_NOTES="$RUNNER_TEMP/desktop-release-notes.md"
          DESKTOP_VERSION="$DESKTOP_VERSION" \
            TAG="$TAG" \
            EXE="$EXE" \
            GENERATED_NOTES="$GENERATED_NOTES" \
            RELEASE_NOTES="$RELEASE_NOTES" \
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const generated = JSON.parse(fs.readFileSync(process.env.GENERATED_NOTES, 'utf8'));
          const generatedBody = String(generated.body || '').trim();
          const exeName = path.basename(process.env.EXE);
          const checksumName = `${exeName}.sha256`;

          const notes = `## Release

          Pidom Desktop ${process.env.DESKTOP_VERSION} for Windows (x64).

          - Installer: \`${exeName}\`
          - SHA-256 checksum: \`${checksumName}\`
          - Commit: \`${process.env.GITHUB_SHA}\`

          ## Install and Verify

          Download \`${exeName}\` and \`${checksumName}\` from this release, then verify the installer before running it:

          \`\`\`sh
          sha256sum -c ${checksumName}
          \`\`\`

          A matching checksum means the installer is byte-for-byte the file produced and attached by this release workflow.

          This build is **not code-signed** yet, so Windows SmartScreen shows an "unknown publisher" warning. After verifying the checksum, choose **More info → Run anyway** to install. Authenticode signing via SignPath Foundation is prepared and will remove this warning once enabled (see \`desktop/SIGNING.md\`).

          ## What's Changed

          ${generatedBody || 'No GitHub changelog entries were generated for this release.'}

          ## Security and Integrity

          - This installer is currently **unsigned**; verify the SHA-256 checksum above before running it.
          - The desktop app shares the same Convex deployment, account, and Google-OIDC security model as the mobile app.
          - Only non-confidential public identifiers (the Convex URL and the desktop OAuth client id/secret) are baked into the binary; PKCE secures the OAuth exchange and no confidential secret is committed or shipped.
          - The renderer runs sandboxed (contextIsolation on, nodeIntegration off) and reaches the main process only through the preload bridge; Electron Fuses harden the packaged app (OnlyLoadAppFromAsar, asar integrity, RunAsNode off).
          - Release assets include a SHA-256 checksum for independent download verification.

          Release tag: https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.TAG}
          `;

          fs.writeFileSync(
            process.env.RELEASE_NOTES,
            notes
              .split('\n')
              .map((line) => line.replace(/^ {10}/, ''))
              .join('\n')
              .trimStart(),
          );
          NODE

          gh release create "$TAG" "$EXE" "${EXE}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Pidom Desktop ${DESKTOP_VERSION}" \
            --notes-file "$RELEASE_NOTES"
