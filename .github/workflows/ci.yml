name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # These need no deployment, and they catch the class of bug that has
      # actually shipped here: a colour utility naming a token that does not
      # exist renders nothing, silently.
      - name: Every colour resolves to a token
        run: node scripts/check-tokens.mjs

      - name: Expo Doctor
        run: npm run doctor

      - name: Expo Android configuration
        run: npm run config:check

  release:
    name: Production release
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Validate release credentials
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$CONVEX_DEPLOY_KEY"

      - name: Deploy Convex production
        run: npx convex deploy --typecheck enable --codegen enable --message "GitHub $GITHUB_SHA"

      - name: Build signed Android APK
        run: eas build --platform android --profile production --non-interactive --wait --freeze-credentials --json > "$RUNNER_TEMP/eas-build.json"

      - name: Download and checksum APK
        id: apk
        run: |
          BUILD_ID="$(node -e 'const build=require(process.argv[1]); process.stdout.write((Array.isArray(build) ? build[0] : build).id)' "$RUNNER_TEMP/eas-build.json")"
          VERSION_CODE="$(node -e 'const build=require(process.argv[1]); const result=Array.isArray(build) ? build[0] : build; const versionCode=result.androidVersionCode ?? result.versionCode ?? result.appBuildVersion; if (versionCode == null) process.exit(1); process.stdout.write(String(versionCode))' "$RUNNER_TEMP/eas-build.json")"
          APK_URL="$(node -e 'const build=require(process.argv[1]); const result=Array.isArray(build) ? build[0] : build; const url=result.artifacts?.applicationArchiveUrl ?? result.artifacts?.buildUrl; if (!url) process.exit(1); process.stdout.write(url)' "$RUNNER_TEMP/eas-build.json")"
          mkdir -p release
          RELEASE_APK="release/Pidom-${VERSION_CODE}.apk"
          curl --fail --location --retry 3 --retry-all-errors --output "$RELEASE_APK" "$APK_URL"
          test -s "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Create public GitHub Release
        env:
          BUILD_ID: ${{ steps.apk.outputs.build_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          APK: ${{ steps.apk.outputs.apk }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(npx expo config --json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version))')"
          TAG="v${APP_VERSION}-android.${VERSION_CODE}"
          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          GENERATED_NOTES="$RUNNER_TEMP/generated-release-notes.json"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS_TAG" > "$GENERATED_NOTES"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" > "$GENERATED_NOTES"
          fi

          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          APP_VERSION="$APP_VERSION" \
            VERSION_CODE="$VERSION_CODE" \
            BUILD_ID="$BUILD_ID" \
            TAG="$TAG" \
            APK="$APK" \
            GENERATED_NOTES="$GENERATED_NOTES" \
            RELEASE_NOTES="$RELEASE_NOTES" \
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const generated = JSON.parse(fs.readFileSync(process.env.GENERATED_NOTES, 'utf8'));
          const generatedBody = String(generated.body || '').trim();
          const apkName = path.basename(process.env.APK);
          const checksumName = `${apkName}.sha256`;

          const notes = `## Release

          Pidom ${process.env.APP_VERSION} for Android, build ${process.env.VERSION_CODE}.

          - APK: \`${apkName}\`
          - SHA-256 checksum: \`${checksumName}\`
          - EAS build ID: \`${process.env.BUILD_ID}\`
          - Commit: \`${process.env.GITHUB_SHA}\`

          ## Install and Verify

          Download \`${apkName}\` and \`${checksumName}\` from this release, then verify the APK before installing:

          \`\`\`sh
          sha256sum -c ${checksumName}
          \`\`\`

          A matching checksum means the APK is byte-for-byte the file produced and attached by this release workflow.

          ## What's Changed

          ${generatedBody || 'No GitHub changelog entries were generated for this release.'}

          ## Security and Integrity

          - The APK is signed by the EAS-managed Android keystore for \`com.pidom.app\`.
          - No local Firebase files, EAS tokens, Convex deploy keys, R2 credentials, keystores, or private keys are committed to this repository.
          - Release assets include a SHA-256 checksum for independent download verification.
          - Production builds upload JavaScript source maps for EAS Observe symbolication; Expo removes embedded source content before storing them.
          - PDF rendering keeps certificate validation enabled by explicitly setting \`trustAllCerts={false}\` on every \`react-native-pdf\` mount.

          ## Observability

          - EAS Observe is enabled for production startup metrics.
          - Expo Router navigation metrics are enabled with sensitive route/query parameters filtered from exported events.
          - SDK 57 JavaScript error reporting is enabled for unhandled and render errors; handled-error reporting is intentionally left out until each recovered error path has a dedicated redaction review.

          ## Updates and Runtime

          This release adds the native \`expo-observe\` dependency, so it ships as a new APK on app version runtime \`${process.env.APP_VERSION}\`. Future JavaScript-only fixes can be published with EAS Update to the matching production runtime.

          Release tag: https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.TAG}
          `;

          fs.writeFileSync(
            process.env.RELEASE_NOTES,
            notes
              .split('\n')
              .map((line) => line.replace(/^ {10}/, ''))
              .join('\n')
              .trimStart(),
          );
          NODE

          gh release create "$TAG" "$APK" "${APK}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Pidom ${APP_VERSION} (Android ${VERSION_CODE})" \
            --notes-file "$RELEASE_NOTES"

      - name: Publish EAS Update
        run: |
          # The APK and checksum have already been attached to the GitHub
          # Release. Remove those generated files before EAS enforces its
          # clean-working-tree release guard.
          rm -rf release
          test -z "$(git status --porcelain)"
          eas update --channel production --environment production --non-interactive \
            --message "GitHub ${GITHUB_SHA}"
