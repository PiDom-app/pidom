<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #18181b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 28px; }
    * { box-sizing: border-box; }
    .grid { display: flex; gap: 26px; flex-wrap: wrap; }
    .cell { width: 260px; }
    .cap { color: #e8e6e3; font-size: 13px; font-weight: 600; margin: 0 0 3px 2px; }
    .sub { color: #6e6c68; font-size: 11px; margin: 0 0 10px 2px; font-variant-numeric: tabular-nums; }
    .frame { width: 260px; height: 563px; position: relative; overflow: hidden; border-radius: 12px; background:#000000; }
    .hero { position: absolute; top: 0; left: 0; right: 0; height: 333px; background-size: cover; background-position: center; }
    .fade { position: absolute; top: 0; left: 0; right: 0; height: 333px; background:linear-gradient(to bottom, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.92) 85%, #000000 100%); }
    .sb { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; color: #fff; z-index: 3; }
    .content { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 28px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 11px; }
    .wordmark { font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; color:#e8e6e3; }
    .tagline { max-width: 210px; text-align: center; font-size: 12px; line-height: 16px; margin: 0; color:#8f8d88; }
    .btn { width: 100%; height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; margin-top: 8px; background:transparent; box-shadow:inset 0 0 0 1px #262523; color:#e8e6e3; }
    .legal { font-size: 10px; line-height: 14px; text-align: center; padding: 0 6px; margin: 0; color:#6e6c68; }
    .legal span { color:#8a7cf0; text-decoration:underline; }
  </style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  var G = '<svg width="15" height="15" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
  var imgs = [
    ['A','Hand + shelf (current)','photo-1513475382585-d06e58bcb0e0'],
    ['B','Stacked books, warm','photo-1535905496755-26ae35d0ae54'],
    ['C','Open book, moody','photo-1532012197267-da84d127e765'],
    ['D','Old books, candle','photo-1419640303358-44f0d27f48e7'],
    ['E','Library shelves','photo-1512903491135-76ec8a4510b7'],
    ['F','Reading, low light','photo-1519791883288-dc8bd696e667']
  ];
  document.getElementById('grid').innerHTML = imgs.map(function(m){
    var url = 'https://images.unsplash.com/'+m[2]+'?w=1200&q=80&auto=format&fit=crop';
    return '<div class="cell">'
      + '<p class="cap">'+m[0]+' — '+m[1]+'</p>'
      + '<p class="sub">'+m[2]+'</p>'
      + '<div class="frame">'
      +   '<div class="hero" style="background-image:url(\''+url+'\')"></div>'
      +   '<div class="fade"></div>'
      +   '<div class="sb"><span>9:41</span><span>&#9679;&#9679;&#9679; &#9776;</span></div>'
      +   '<div class="content">'
      +     '<h1 class="wordmark">Pidom</h1>'
      +     '<p class="tagline">Your PDFs, your highlights, and where you left off — on every device.</p>'
      +     '<div class="btn">'+G+' Continue with Google</div>'
      +     '<p class="legal">By signing in, you agree to our <span>Terms of Service</span> and <span>Privacy Policy</span>.</p>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }).join('');
</script>
</body>
</html>
