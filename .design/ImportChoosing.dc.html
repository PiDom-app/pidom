<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #6a59e8; } a:hover { color: #7a6af0; }
    .c2, .c5 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .c2 { -webkit-line-clamp: 2; } .c5 { -webkit-line-clamp: 5; }
    .pretty { text-wrap: pretty; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width:390px;min-height:844px;background:#000000;overflow:hidden">
<div style="height:844px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0">
    <span style="font-size:14px;color:#8f8d88">Cancel</span>
    <span style="font-size:16px;font-weight:600;letter-spacing:-.01em;color:#e8e6e3">Add to library</span>
    <span style="font-size:14px;color:transparent">Cancel</span>
  </div>

  <div style="flex:1;padding:0 24px;overflow:hidden">
    <div style="display:flex;justify-content:center;margin-top:26px">
      <div style="width:132px;height:187px;border-radius:6px;background:#1a1a1a;display:flex;align-items:center;justify-content:center">
             <div style="width:22px;height:22px;border-radius:9999px;box-shadow:inset 0 0 0 2px #262523;border-top:2px solid #6a59e8"></div>
           </div>
    </div>

    <div style="margin-top:18px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6e6c68">Title</div>
      <div style="margin-top:7px;height:44px;display:flex;align-items:center;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px #262523">
        <span style="font-size:14px;color:#e8e6e3">Thinking, Fast and Slow</span>
      </div>
    </div>
    <div style="margin-top:18px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6e6c68">Author</div>
      <div style="margin-top:7px;height:44px;display:flex;align-items:center;padding:0 12px;border-radius:6px;box-shadow:inset 0 0 0 1px #262523">
        <span style="font-size:14px;color:#e8e6e3">Daniel Kahneman</span>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;align-items:center;gap:6px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6e6c68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size:12px;color:#6e6c68">PDF · 4.1 MB</span>
    </div>

    <div style="margin-top:22px;height:1px;background:#1c1b1a"></div>

    <div style="display:flex;align-items:flex-start;gap:14px;padding:18px 0">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8f8d88" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
      <div style="flex:1">
        <div style="font-size:15px;color:#e8e6e3">Available on all devices</div>
        <div style="margin-top:3px;font-size:12px;line-height:17px;color:#6e6c68" class="pretty">Keeps a copy in your account so your other phones can download it.</div>
      </div>
      <div style="width:44px;height:26px;border-radius:9999px;background:#6a59e8;position:relative;flex:0 0 auto;margin-top:2px;">
        <div style="position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:9999px;background:#ffffff"></div>
      </div>
    </div>

    
  </div>

  <div style="padding:0 24px 34px">
    <div style="height:48px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#1a1a1a">
      <span style="font-size:15px;font-weight:500;color:#4e4d4a">Add to library</span>
    </div>
  </div>
</div>
</div>
</x-dc>

</body>
</html>
