<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #18181b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 32px; }
    * { box-sizing: border-box; }
    .grid { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-start; }
    .label { color: #8f8d88; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px 2px; }
    .frame { width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 14px; }
    .c2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 2; }
    .pretty { text-wrap: pretty; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  // ---- glyphs ------------------------------------------------------------
  var bell = function(stroke, w){ w=w||22; return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="'+stroke+'" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/></svg>'; };
  var search = function(stroke){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+stroke+'" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'; };
  var back = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8e6e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>';
  var gShare = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8f8d88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg>';
  var gCheck = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8f8d88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M20 6 9 17l-5-5"/></svg>';
  var gPeople = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8f8d88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
  var lock = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6e6c68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;display:block"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  // ---- covers ------------------------------------------------------------
  function paperCover(title, author, t){
    var lines = '';
    var ys = [78,87,96,105,114,123,132,141,150];
    for (var i=0;i<ys.length;i++){ var w = (i===3||i===7)?58:92; lines += '<div style="position:absolute;left:14px;top:'+ys[i]+'px;width:'+w+'px;height:1.6px;background:#c9c6c0"></div>'; }
    return '<div style="position:relative;width:120px;height:170px;flex:0 0 auto;border-radius:6px;overflow:hidden;background:'+(t?'#fdfdfc':'#fdfdfc')+';box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)">'
      + '<div style="position:absolute;left:14px;right:14px;top:28px;font-size:11px;line-height:1.2;font-weight:700;letter-spacing:-.01em;color:#1a1a1a" class="c2">'+title+'</div>'
      + '<div style="position:absolute;left:14px;top:58px;font-size:7px;color:#6e6c68">'+(author||'')+'</div>'
      + lines + '</div>';
  }
  function tintCover(title, hue){
    return '<div style="position:relative;width:120px;height:170px;flex:0 0 auto;border-radius:6px;overflow:hidden;background:oklch(0.295 0.062 '+hue+');box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)">'
      + '<div style="position:absolute;left:10px;right:10px;top:10px;font-size:12.5px;line-height:1.26;font-weight:600;letter-spacing:-.01em;color:oklch(0.900 0.045 '+hue+')" class="c2 pretty">'+title+'</div>'
      + '<div style="position:absolute;right:8px;bottom:7px;font-size:8px;font-weight:600;letter-spacing:.09em;opacity:.48;color:oklch(0.900 0.045 '+hue+')">PDF</div></div>';
  }
  function progressItem(cover, title, pct, meta){
    return '<div style="width:120px;flex:0 0 auto">'+cover
      + '<div style="margin-top:8px;font-size:12px;line-height:16px;letter-spacing:-.006em;color:#e8e6e3" class="c2">'+title+'</div>'
      + '<div style="margin-top:7px;height:2px;border-radius:6px;background:#262523;overflow:hidden"><div style="width:'+pct+'%;height:100%;border-radius:6px;background:#6a59e8"></div></div>'
      + '<div style="margin-top:5px;font-size:10px;line-height:13px;color:#6e6c68">'+meta+'</div></div>';
  }
  function plainItem(cover, title, meta){
    return '<div style="width:120px;flex:0 0 auto">'+cover
      + '<div style="margin-top:8px;font-size:12px;line-height:16px;letter-spacing:-.006em;color:#e8e6e3" class="c2">'+title+'</div>'
      + '<div style="margin-top:4px;font-size:10px;line-height:13px;color:#6e6c68">'+meta+'</div></div>';
  }
  function rail(title, items){
    return '<section style="margin-top:28px">'
      + '<div style="padding:0 24px;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.014em;color:#e8e6e3">'+title+'</div>'
      + '<div style="margin-top:12px;display:flex;gap:14px;padding:0 24px;overflow:hidden">'+items.join('')+'</div></section>';
  }

  // ---- header (Direction A: bell + unread badge, beside avatar) ----------
  function homeHeader(){
    return '<div style="padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px">'
      + '<div style="min-width:0">'
      +   '<div style="font-size:12px;line-height:16px;color:#6e6c68">Good evening</div>'
      +   '<div style="margin-top:2px;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.02em;color:#e8e6e3">Emmanuel</div>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:14px;flex:0 0 auto">'
      +   '<div style="position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center">'
      +     bell('#e8e6e3',22)
      +     '<div style="position:absolute;top:-3px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9999px;background:#6a59e8;box-shadow:0 0 0 2px #000000;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;font-weight:600;color:#fff" class="tnum">2</span></div>'
      +   '</div>'
      +   '<div style="width:36px;height:36px;border-radius:9999px;background:#6a59e8;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;font-weight:600;color:#fff;letter-spacing:.01em">EG</div>'
      + '</div></div>';
  }
  function searchPill(){
    return '<div style="margin:20px 24px 0;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:6px;background:#0d0d0d;box-shadow:inset 0 0 0 1px #1c1b1a">'
      + search('#6e6c68') + '<span style="font-size:14px;color:#6e6c68">Search your library</span></div>';
  }

  // ---- activity row ------------------------------------------------------
  function eventRow(initials, hue, glyph, name, rest, when, unread){
    var col = unread ? '#e8e6e3' : '#8f8d88';
    var dot = unread ? '<div style="width:7px;height:7px;border-radius:9999px;background:#6a59e8;flex:0 0 auto;margin-top:7px"></div>' : '';
    return '<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 24px">'
      + '<div style="position:relative;flex:0 0 auto">'
      +   '<div style="width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:oklch(0.295 0.062 '+hue+');color:oklch(0.900 0.045 '+hue+');font-size:13px;font-weight:600;letter-spacing:.01em">'+initials+'</div>'
      +   '<div style="position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:9999px;background:#000;display:flex;align-items:center;justify-content:center">'+glyph+'</div>'
      + '</div>'
      + '<div style="flex:1;min-width:0;padding-top:1px">'
      +   '<div style="font-size:14px;line-height:19px;color:'+col+'" class="pretty"><b style="font-weight:600;color:'+col+'">'+name+'</b> '+rest+'</div>'
      +   '<div style="margin-top:3px;font-size:11px;color:#6e6c68">'+when+'</div>'
      + '</div>' + dot + '</div>';
  }

  // ==== FRAME 1 — Library home (dark) ====================================
  var home =
    '<div class="frame" style="background:#000">'
    + '<div style="position:absolute;inset:0;overflow:hidden">'
    + '<div style="padding-top:24px">'
    + homeHeader() + searchPill()
    + rail('Continue reading', [
        progressItem(paperCover('Thinking, Fast and Slow','Daniel Kahneman'), 'Thinking, Fast and Slow', 43, '43% · page 216 of 499'),
        progressItem(paperCover('The Design of Everyday Things','Don Norman'), 'The Design of Everyday Things', 71, '71% · page 261 of 368'),
        progressItem(tintCover('Convex Backend Architecture',282), 'Convex Backend Architecture', 18, '18% · page 15 of 84')
      ])
    + rail('Recently added', [
        plainItem(paperCover('Annual Report 2025','Kilimani Housing Co-op'), 'Annual Report 2025', 'PDF · 2.4 MB'),
        plainItem(paperCover('Lease Agreement — 14 Kilimani Road',''), 'Lease Agreement — 14 Kilimani Road', 'PDF · 9 pages'),
        plainItem(tintCover('React Native Performance Notes',192), 'React Native Performance Notes', 'PDF · 380 KB')
      ])
    + '</div>'
    // status bar (drawn last, on top)
    + '<div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:600;color:#e8e6e3;z-index:3"><span>9:41</span><span>&#9679;&#9679;&#9679; &#9776;</span></div>'
    + '</div></div>';

  // ==== FRAME 2 — Activity (dark) =======================================
  var activity =
    '<div class="frame" style="background:#000">'
    + '<div style="position:absolute;inset:0;display:flex;flex-direction:column">'
    + '<div style="display:flex;align-items:center;padding:44px 24px 12px;flex:0 0 auto">'
    +   back
    +   '<div style="margin-left:10px;flex:0 0 auto">'+bell('#8f8d88',18)+'</div>'
    +   '<div style="flex:1;min-width:0;margin-left:10px"><div style="font-size:15px;font-weight:600;letter-spacing:-.01em;color:#e8e6e3">Activity</div>'
    +     '<div style="margin-top:2px;font-size:12px;color:#6e6c68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">2 you have not seen</div></div>'
    +   '<div style="min-width:18px;height:18px;padding:0 5px;border-radius:9999px;background:#6a59e8;display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="font-size:10px;font-weight:600;color:#fff" class="tnum">2</span></div>'
    + '</div>'
    + '<div style="height:1px;background:#1c1b1a;flex:0 0 auto"></div>'
    + '<div style="flex:1;min-height:0;overflow:hidden"><div style="padding-top:2px">'
    +   eventRow('AW',102,gShare,'Amina Wanjiru','shared a PDF with you','2 hours ago',true)
    +   eventRow('GO',342,gCheck,'Grace Otieno','accepted a PDF you shared','4 hours ago',true)
    +   eventRow('JK',102,gShare,'Joseph Kimani','shared a PDF with Reading group','Yesterday',false)
    +   eventRow('FN',222,gPeople,'Faith Njeri','added you to Kilimani Housing Co-op','3 days ago',false)
    +   eventRow('GO',342,gCheck,'Grace Otieno','accepted a PDF you shared','Last week',false)
    +   '<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 24px"><div style="margin-top:1px">'+lock+'</div>'
    +     '<div style="flex:1;font-size:12px;line-height:17px;color:#6e6c68" class="pretty">A row here never says which document. The title comes from a query that checks you can still read it — a feed that cached titles would keep showing them after access was removed.</div></div>'
    + '</div></div></div></div>';

  document.getElementById('grid').innerHTML =
    '<div><p class="label">Library home — dark · bell + unread badge in header</p>'+home+'</div>'
    + '<div><p class="label">Activity — dark · what the bell opens</p>'+activity+'</div>';
</script>
</body>
</html>
